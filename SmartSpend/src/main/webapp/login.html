<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SmartSpend</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-brand">SmartSpend</h1>
        <p class="auth-subtitle">Personal Expense & Budget Management System</p>
        <h2 class="auth-title">Account Login</h2>
      </div>

      <!-- Error / Success Alert Messages -->
      <div id="alertMessage" style="display: none;"></div>

      <form action="login" method="POST" id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div style="margin-top: 1.25rem; padding: 0.75rem; background: #f8fafc; border-radius: 8px; border: 1px dashed #cbd5e1; font-size: 0.8rem; color: #64748b;">
        <strong>Quick Test Credential:</strong><br>
        Email: <code>rahul@example.com</code> | Password: <code>Student@123</code><br>
        <a href="#" id="fillTestCreds" style="font-size: 0.78rem; text-decoration: underline; color: var(--primary);">Click to auto-fill</a>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

  <script>
    // Parse URL parameters for error or success notifications
    const params = new URLSearchParams(window.location.search);
    const alertBox = document.getElementById('alertMessage');
    
    if (params.has('error')) {
      alertBox.className = 'alert alert-danger';
      alertBox.textContent = decodeURIComponent(params.get('error'));
      alertBox.style.display = 'block';
    } else if (params.has('success')) {
      alertBox.className = 'alert alert-success';
      alertBox.textContent = decodeURIComponent(params.get('success'));
      alertBox.style.display = 'block';
    } else if (params.has('logout')) {
      alertBox.className = 'alert alert-success';
      alertBox.textContent = 'You have been successfully logged out.';
      alertBox.style.display = 'block';
    }

    document.getElementById('fillTestCreds')?.addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('email').value = 'rahul@example.com';
      document.getElementById('password').value = 'Student@123';
    });
  </script>
</body>
</html>
